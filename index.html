<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Почта МГТУ</title>
  <!-- Страница-переходник: находит текущий адрес мини-приложения (он лежит в tunnel.json
       этого репозитория и обновляется программой на ноутбуке) и открывает его. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #efeff4);
      --text: var(--tg-theme-text-color, #000);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #fff);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-tg]) { --bg: #000; --text: #fff; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
    .icon { font-size: 44px; }
    h1 { margin: 0; font-size: 19px; font-weight: 600; }
    p { margin: 0; color: var(--hint); max-width: 320px; }
    button { border: 0; border-radius: 10px; padding: 10px 20px; font: inherit; font-weight: 500;
      background: var(--accent); color: var(--accent-text); cursor: pointer; }
    .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--hint);
      border-top-color: transparent; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div id="loading" class="spinner" aria-label="Загрузка"></div>
    <div id="offline" hidden>
      <div class="icon">💤</div>
      <h1>Ноутбук сейчас не на связи</h1>
      <p id="reason">Приложение работает, пока ноутбук включён и не спит. Откройте крышку — через минуту всё заработает.</p>
      <p style="margin-top:14px"><button id="retry" type="button">Попробовать снова</button></p>
    </div>
  </main>
  <script>
    "use strict";
    (function () {
      const REPO = "VasaBacaV/mail";
      const BRANCH = "main";
      // Открываем только адреса наших туннелей — на случай, если файл кто-то подменит
      const ALLOWED = /^https:\/\/[a-z0-9-]+\.(lhr\.life|trycloudflare\.com)$/;
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        document.documentElement.setAttribute("data-tg", "");
        tg.ready();
        tg.expand();
      }

      async function readAddress() {
        // Сначала через API GitHub (без задержек кэша), если не вышло — через raw (кэш до 5 минут)
        try {
          const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/tunnel.json?ref=" + BRANCH,
            { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
          if (r.ok) return (await r.json()).url;
        } catch (e) { /* пробуем второй способ */ }
        const r = await fetch("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/tunnel.json?t=" + Date.now(),
          { cache: "no-store" });
        return (await r.json()).url;
      }

      async function alive(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 12000);
        try {
          const r = await fetch(url + "/health", { cache: "no-store", signal: controller.signal });
          return r.ok && (await r.text()) === "ok";
        } catch (e) {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      function offline(text) {
        document.getElementById("loading").hidden = true;
        document.getElementById("offline").hidden = false;
        if (text) document.getElementById("reason").textContent = text;
      }

      async function go() {
        document.getElementById("loading").hidden = false;
        document.getElementById("offline").hidden = true;
        let url;
        try {
          url = await readAddress();
        } catch (e) {
          offline("Не удалось узнать адрес приложения. Проверьте интернет и попробуйте снова.");
          return;
        }
        if (!url || !ALLOWED.test(url)) {
          offline("Адрес приложения ещё не записан. Запустите программу на ноутбуке.");
          return;
        }
        if (!(await alive(url))) {
          offline();
          return;
        }
        // Данные Telegram (подпись) передаются в «хвосте» адреса — переносим его как есть
        location.replace(url + "/" + location.search + location.hash);
      }

      document.getElementById("retry").addEventListener("click", go);
      go();
    })();
  </script>
</body>
</html>
